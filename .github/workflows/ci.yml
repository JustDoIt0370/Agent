name: Java CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: .m2/repository
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Check browser JavaScript
        run: node --check src/main/resources/static/app.js
      - name: Check local environment loader
        shell: pwsh
        run: ./scripts/test-env.ps1
