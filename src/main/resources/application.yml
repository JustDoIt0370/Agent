server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: ops-pilot
  datasource:
    url: jdbc:h2:file:./data/opspilot;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    hikari:
      maximum-pool-size: 4
      pool-name: workspace
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
agent:
  api-key: ${AGENT_API_KEY:}
  base-url: ${AGENT_BASE_URL:https://api.openai.com}
  model: ${AGENT_MODEL:gpt-4.1-mini}
  max-rounds: 8
  max-tool-calls: 12
  timeout-seconds: 60
logging:
  level:
    root: INFO
    dev.portfolio.opspilot: INFO
